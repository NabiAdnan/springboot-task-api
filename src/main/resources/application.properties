# Default profile: PostgreSQL via environment variables (see docker-compose.yml).
# Override with: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskdb}
spring.datasource.username=${DB_USERNAME:taskuser}
spring.datasource.password=${DB_PASSWORD:taskpass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Dev-only default secret. Override with JWT_SECRET in any real deployment.
jwt.secret=${JWT_SECRET:dev-only-change-me-in-production-0123456789abcdef-0123456789abcdef}
jwt.expiration-ms=86400000
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health
